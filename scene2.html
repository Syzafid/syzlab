<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A-Frame VR - Scene 2: Panorama 360° Kota Shanghai Sci-Fi</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="./js/components.js"></script>
  <style>
    #back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 9999;
      background: rgba(10, 15, 30, 0.85);
      color: #00CED1;
      border: 2px solid #00CED1;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: bold;
      font-family: 'Outfit', sans-serif, system-ui;
      cursor: pointer;
      backdrop-filter: blur(10px);
      font-size: 16px;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(0, 206, 209, 0.4);
    }
    #back-btn:hover {
      background: #00CED1;
      color: #050711;
      box-shadow: 0 0 25px rgba(0, 206, 209, 0.8);
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <!-- Top UI Return Button -->
  <button id="back-btn" onclick="window.location.href='./index.html'">
    🏛️ Kembali ke Metaverse Gallery
  </button>

  <a-scene>

    <a-assets timeout="5000">
      <img id="sky360" src="./assets/textures/panorama.jpg" />
    </a-assets>

    <a-sky src="#sky360"></a-sky>

    <!-- Hotspot A - Menara Pusat -->
    <a-sphere id="hotspot1" color="#00CED1" opacity="0.85" radius="0.3" position="-5 3.3 -8" class="clickable"
      animation__idle="property: position; to: -5 3.4 -8; dir: alternate; dur: 2000; loop: true; easing: easeInOutSine"
      animation__hover="property: scale; to: 1.5 1.5 1.5; startEvents: mouseenter; dur: 100"
      animation__leave="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 100">
    </a-sphere>
    <a-text value="Menara Pusat" color="#00CED1" position="-5 4.2 -8" width="8" align="center" look-at-camera></a-text>

    <!-- Hotspot B - Zona Energi -->
    <a-sphere id="hotspot2" color="#FF6347" opacity="0.85" radius="0.3" position="-20 1.6 5" class="clickable"
      animation__idle="property: position; to: -20 2.1 5; dir: alternate; dur: 2500; loop: true; easing: easeInOutSine"
      animation__hover="property: scale; to: 3 3 3; startEvents: mouseenter; dur: 100"
      animation__leave="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 100">
    </a-sphere>
    <a-text value="Zona Energi" color="#FF6347" position="-20 2.7 5" width="14" align="center" look-at-camera></a-text>

    <!-- Hotspot C - Terminal Udara -->
    <a-sphere id="hotspot3" color="#9370DB" opacity="0.85" radius="0.3" position="-18 1.6 -3" class="clickable"
      animation__idle="property: position; to: -18 2.1 -3; dir: alternate; dur: 2200; loop: true; easing: easeInOutSine"
      animation__hover="property: scale; to: 3 3 3; startEvents: mouseenter; dur: 100"
      animation__leave="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 100">
    </a-sphere>
    <a-text value="Terminal Udara" color="#9370DB" position="-18 2.7 -3" width="14" align="center"
      look-at-camera></a-text>

    <!-- Hotspot D - Jalur Expressway -->
    <a-sphere id="hotspot4" color="#FFD700" opacity="0.85" radius="0.3" position="7 1.6 -3" class="clickable"
      animation__idle="property: position; to: 7 2.1 -3; dir: alternate; dur: 1800; loop: true; easing: easeInOutSine"
      animation__hover="property: scale; to: 1.5 1.5 1.5; startEvents: mouseenter; dur: 100"
      animation__leave="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 50">
    </a-sphere>
    <a-text value="Jalur Expressway" color="#0B6623" position="7 2.7 -3" width="8" align="center"
      look-at-camera></a-text>

    <!-- Hotspot E - Menara Oriental Pearl -->
    <a-sphere id="hotspot5" color="#FFD700" opacity="0.85" radius="0.3" position="-9.7 3.3 -6" class="clickable"
      animation__idle="property: position; to: -9.7 3.4 -6; dir: alternate; dur: 1800; loop: true; easing: easeInOutSine"
      animation__hover="property: scale; to: 1.5 1.5 1.5; startEvents: mouseenter; dur: 100"
      animation__leave="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 50">
    </a-sphere>
    <a-text value="Menara Oriental Pearl" color="#FFD700" position="-9.7 4.2 -6" width="8" align="center"
      look-at-camera></a-text>

    <a-text value="Scene 2: Panorama 360° Kota Shanghai" color="#FFD700" position="0 4.2 -6" width="7" align="center"></a-text>

    <a-link href="index.html" title="← Kembali ke Metaverse Hub" position="-5 1.6 -5" class="clickable"></a-link>

    <!-- Lampu -->
    <a-light type="ambient" color="#334" intensity="0.5"></a-light>
    <a-light type="point" color="#00CED1" intensity="1" distance="12" position="0 4 0"></a-light>

    <a-camera position="0 1.6 0" wasd-controls="enabled: false" look-controls="enabled: true">
      <a-cursor color="#FFD166" fuse="true" fuse-timeout="1500" raycaster="far: 20; objects: .clickable"></a-cursor>

      <!-- Panel info -->
      <a-entity id="infoPanel" visible="false" position="0 0 -2.5">
        <a-plane color="#000033" opacity="0.92" width="4" height="1.4"></a-plane>
        <a-text id="infoText" value="" color="#FFFFFF" width="3.5" align="center" position="0 0 0.01"></a-text>
      </a-entity>
    </a-camera>

  </a-scene>

  <script>
    const panel = document.querySelector('#infoPanel');
    const infoText = document.querySelector('#infoText');
    let timer = null;

    function tampilInfo(teks) {
      infoText.setAttribute('value', teks);
      panel.setAttribute('visible', 'true');

      clearTimeout(timer);
      timer = setTimeout(() => panel.setAttribute('visible', 'false'), 4000);
    }

    function sembunyikanInfo() {
      clearTimeout(timer);
      panel.setAttribute('visible', 'false');
    }

    document.querySelector('#hotspot1').addEventListener('click', () =>
      tampilInfo('Menara Pusat (Shanghai Tower)\nPusat kendali seluruh jaringan\nenergi dan komunikasi kota\nhotel kelas mewah.')
    );

    document.querySelector('#hotspot2').addEventListener('click', () =>
      tampilInfo('Zona Energi\nArea pembangkit energi terbarukan.\nMensuplai daya seluruh kota.')
    );

    document.querySelector('#hotspot3').addEventListener('click', () =>
      tampilInfo('Terminal Udara\nTerminal kendaraan terbang otonom.\nMelayani ribuan penumpang per hari.')
    );

    document.querySelector('#hotspot4').addEventListener('click', () =>
      tampilInfo('Jalur Expressway\nJalur transportasi cepat tanpa hambatan.\nKecepatan maksimal 300 km/jam.')
    );

    document.querySelector('#hotspot5').addEventListener('click', () =>
      tampilInfo('Menara Oriental Pearl\nLandmark ikonik kota.\nMenyediakan pemandangan menakjubkan.')
    );

    document.querySelectorAll('[id^="hotspot"]').forEach(hotspot => {
      hotspot.addEventListener('mouseleave', sembunyikanInfo);
    });
  </script>

</body>

</html>
